{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{{ titulo_pagina }}</title>
    <link rel="stylesheet" href="{% static 'css/body.css' %}">
    <link rel="stylesheet" href="{% static 'css/headerBoostrap.css' %}">
    <link rel="stylesheet" href="{% static 'css/footer.css' %}">

    <link rel="stylesheet" href="{% static 'css/inicio.css' %}">
</head>
<body>
    <header class="perfil">MovieCali</header>
    <main>
        <h1 class="titulo-principal">{{ titulo_pagina }}</h1>
        <a href="{% url 'peliculas:agregar' %}" class="boton-superior">Agregar película</a>
        <div class="catalogo-peliculas">
        {% for pelicula in peliculas %}
            <div class="card">
                <img src="{{ pelicula.imagen }}" alt="Póster de {{ pelicula.titulo }}">
                <p class="subtitulo-tarjeta">{{ pelicula.titulo }}</p>
                <a href="{% url 'peliculas:resenas_pelicula' pelicula.id %}" class="btn">Ver película</a>
            </div>
        {% empty %}
            <p>Todavía no hay películas cargadas.</p>
        {% endfor %}
        </div>
    </main>
    <footer class="footer"><p class="titulo-footer">MovieCali 2.0</p></footer>
</body>
</html>
